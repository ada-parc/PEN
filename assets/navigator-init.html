<!--
  PEN navigator mode.

  A navigator opens the site from a personal link, e.g. ...?nav=N-014-7.
  This script reads that code, checks it, keeps it in the visitor's own
  browser (localStorage key `pen:nav:v1`), and removes it from the address
  bar so it is not bookmarked or shared by accident.

  The bar under the menu is always there, so a visitor can always tell which
  mode they are in. Navigator mode: "Navigator mode", the code, and check-in
  status. Public view: "Public view" and a "Navigator? Get back in" button
  that opens a drawer. The drawer takes the code (same check as the link) or
  emails the PEN team. There is deliberately no way to leave navigator mode
  from the page: navigators and public visitors are not expected to share a
  browser.

  Codes are "N-", three digits, and one check digit (the Damm algorithm,
  which catches every single wrong digit and every swap of two neighbouring
  digits). Set CHECK_DIGIT to false to accept the plain "N-014" form
  instead. scripts/navigator_codes.py makes the codes and links.

  Loaded via `include-after-body` in _quarto.yml, before
  assets/progress-init.html, so window.penNav is ready for it. The bar is
  placed inside #quarto-header, under the navbar, before Quarto measures the
  header, so page content still starts below it. Styles: `.pen-nav*` in
  pen.scss. Nothing here sends anything anywhere; the email link only opens
  the visitor's own email app.
-->
<script>
(function () {
  "use strict";

  var KEY = "pen:nav:v1";
  var PARAM = "nav";
  var CHECK_DIGIT = true;
  var CONTACT = "mailto:hammel@uic.edu?subject=PEN%20navigator%20link";
  // Same address, with the message started for them.
  var HELPMAIL = CONTACT + "&body=" + encodeURIComponent("I lost my navigator link or code.\n\nMy name:\n");
  // Site root from the logo link ("./index.html" or "../index.html").
  var brandLink = document.querySelector(".navbar-brand");
  var HELP = (brandLink ? (brandLink.getAttribute("href") || "").replace(/index\.html$/, "") : "") + "help.html#navigator";

  var DAMM = [
    [0, 3, 1, 7, 5, 9, 8, 6, 4, 2],
    [7, 0, 9, 2, 1, 5, 4, 8, 6, 3],
    [4, 2, 0, 6, 8, 7, 1, 3, 5, 9],
    [1, 7, 5, 0, 9, 8, 3, 4, 2, 6],
    [6, 1, 2, 3, 0, 4, 5, 9, 7, 8],
    [3, 6, 7, 4, 2, 0, 9, 5, 8, 1],
    [5, 8, 6, 9, 7, 2, 0, 1, 3, 4],
    [8, 9, 4, 5, 3, 6, 2, 0, 1, 7],
    [9, 4, 3, 8, 6, 1, 7, 2, 0, 5],
    [2, 5, 8, 1, 4, 3, 6, 7, 9, 0]
  ];

  function damm(digits) {
    var interim = 0;
    for (var i = 0; i < digits.length; i++) interim = DAMM[interim][+digits.charAt(i)];
    return interim;
  }

  // Accepts small variations (lowercase, spaces, missing or typographic
  // dashes) and returns the code in its one saved form, or null.
  function normalize(raw) {
    var s = String(raw || "").toUpperCase().replace(/[\s‐-―−]/g, function (c) {
      return /\s/.test(c) ? "" : "-";
    });
    var m = CHECK_DIGIT ? /^N-?(\d{3})-?(\d)$/.exec(s) : /^N-?(\d{3})$/.exec(s);
    if (!m) return null;
    if (CHECK_DIGIT && damm(m[1] + m[2]) !== 0) return null;
    return "N-" + m[1] + (CHECK_DIGIT ? "-" + m[2] : "");
  }

  function read() {
    try {
      var o = JSON.parse(window.localStorage.getItem(KEY) || "null");
      return o && typeof o.code === "string" && normalize(o.code) === o.code ? o : null;
    } catch (e) { return null; }
  }

  function write(code) {
    try { window.localStorage.setItem(KEY, JSON.stringify({ code: code, since: new Date().toISOString() })); return true; }
    catch (e) { return false; }
  }

  function clear() {
    try { window.localStorage.removeItem(KEY); } catch (e) {}
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // --- Read the link ------------------------------------------------
  var saved = read();
  var code = saved ? saved.code : null;
  var notice = null;
  var params = null;
  try { params = new URLSearchParams(window.location.search); } catch (e) {}

  if (params && params.has(PARAM)) {
    var fromLink = normalize(params.get(PARAM));
    if (!fromLink) {
      notice = 'This navigator link doesn’t look right. Check the link in your email, or <a class="no-external" href="' +
        CONTACT + '">contact us<span class="visually-hidden"> (opens your email app)</span></a>.';
    } else if (fromLink !== code) {
      if (code) notice = "Navigator mode is now " + fromLink + ", replacing " + code + ".";
      if (!write(fromLink)) {
        notice = "Your browser is not saving, so navigator mode will turn off when you leave this page.";
      }
      code = fromLink;
    }
    params.delete(PARAM);
    var qs = params.toString();
    try {
      window.history.replaceState(window.history.state, "",
        window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
    } catch (e) {}
  }

  window.penNav = {
    key: KEY,
    code: code,
    active: Boolean(code),
    normalize: normalize
  };

  function changed(previous) {
    try {
      window.dispatchEvent(new CustomEvent("pen:navchange", { detail: { code: window.penNav.code, previous: previous } }));
    } catch (e) {}
  }

  // --- The bar under the navbar ---------------------------------------
  // Always in the page, in both states, so the visitor can always tell which
  // mode they are in. Navigator mode: a strong status line with the code.
  // Public view: a quiet line with a way back in (a drawer that takes the
  // code, plus an email to the team). Below them: a notice line and the drawer.
  var header = document.getElementById("quarto-header");
  if (!header) return;
  var bar = document.createElement("div");
  bar.className = "pen-nav";
  bar.setAttribute("role", "region");
  bar.setAttribute("aria-label", "Navigator mode");
  header.appendChild(bar);

  var FIELD_ID = "pen-nav-code-input";
  var ERR_ID = "pen-nav-code-error";
  var DRAWER_ID = "pen-nav-drawer";

  // The notice line is always in the page so screen readers announce what
  // lands in it. The drawer is only built when someone opens it.
  bar.innerHTML = '<div class="pen-nav-status" hidden></div>' +
    '<div class="pen-nav-notice" role="status" tabindex="-1" hidden></div>';
  var statusEl = bar.querySelector(".pen-nav-status");
  var noticeEl = bar.querySelector(".pen-nav-notice");
  var drawerEl = null;

  function toggleBtn() { return statusEl.querySelector(".pen-nav-toggle"); }

  function paintStatus() {
    if (window.penNav.active) {
      closeDrawer(false);
      statusEl.className = "pen-nav-status is-navigator";
      statusEl.innerHTML = '<p class="pen-nav-label">' +
        '<strong class="pen-nav-badge">Navigator<span class="pen-nav-long"> mode</span></strong>' +
        '<span class="pen-nav-code">' + esc(window.penNav.code) + '</span></p>';
    } else {
      statusEl.className = "pen-nav-status is-public";
      statusEl.innerHTML = '<p class="pen-nav-label"><strong class="pen-nav-public">Public view</strong>' +
        '</p>' +
        '<button type="button" class="pen-nav-toggle" aria-expanded="false" aria-controls="' + DRAWER_ID + '">' +
        '<span class="pen-nav-toggle-text">Navigator? Get back in</span></button>';
      toggleBtn().addEventListener("click", function () {
        if (drawerEl && !drawerEl.hidden) closeDrawer(true); else openDrawer();
      });
    }
    statusEl.hidden = false;
    fit();
  }

  function showNotice(html) {
    noticeEl.hidden = false;
    noticeEl.innerHTML = "";
    fit();
    window.setTimeout(function () {
      noticeEl.innerHTML = "<p>" + html + '</p><button type="button" class="pen-nav-dismiss">Dismiss</button>';
      noticeEl.querySelector(".pen-nav-dismiss").addEventListener("click", dismissNotice);
      fit();
    }, 30);
  }

  function dismissNotice() {
    noticeEl.innerHTML = "";
    noticeEl.hidden = true;
    fit();
    var back = toggleBtn();
    var main = document.querySelector("main");
    if (back) back.focus();
    else if (main) { main.setAttribute("tabindex", "-1"); main.focus(); }
  }

  // Quarto re-offsets the page by the header's height on resize, so tell it
  // the height changed whenever the bar grows or shrinks.
  function fit() {
    try { window.dispatchEvent(new Event("resize")); } catch (e) {}
  }

  // --- The "get back in" drawer (public view only) -----------------------
  function buildDrawer() {
    drawerEl = document.createElement("div");
    drawerEl.className = "pen-nav-drawer";
    drawerEl.id = DRAWER_ID;
    drawerEl.hidden = true;
    drawerEl.innerHTML =
      '<form class="pen-nav-form" novalidate>' +
      '<p class="pen-nav-drawer-title">Get back in to navigator mode</p>' +
      '<label for="' + FIELD_ID + '">Navigator code</label>' +
      '<div class="pen-nav-field">' +
      '<input id="' + FIELD_ID + '" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" ' +
      'aria-errormessage="' + ERR_ID + '">' +
      '<button type="submit" class="pen-nav-submit">Turn on navigator mode</button></div>' +
      '<p class="pen-nav-error" id="' + ERR_ID + '" role="alert" hidden></p>' +
      '</form>' +
      '<div class="pen-nav-lost"><p class="pen-nav-drawer-title">Lost your code or link?</p>' +
      '<p><a class="no-external" href="' + HELPMAIL + '">Email the PEN team' +
      '<span class="visually-hidden"> (opens your email app)</span></a>. We will reply with your link.</p></div>';
    bar.insertBefore(drawerEl, noticeEl);

    var input = drawerEl.querySelector("input");
    input.addEventListener("input", clearError);
    drawerEl.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault();
      turnOn(input.value);
    });
    drawerEl.addEventListener("keydown", function (e) {
      if (e.key === "Escape") { e.stopPropagation(); closeDrawer(true); }
    });
  }

  function openDrawer() {
    if (!drawerEl) buildDrawer();
    drawerEl.hidden = false;
    var t = toggleBtn();
    if (t) {
      t.setAttribute("aria-expanded", "true");
      t.querySelector(".pen-nav-toggle-text").textContent = "Close";
    }
    fit();
    drawerEl.querySelector("input").focus();
  }

  function closeDrawer(returnFocus) {
    if (!drawerEl || drawerEl.hidden) return;
    drawerEl.hidden = true;
    clearError();
    var t = toggleBtn();
    if (t) {
      t.setAttribute("aria-expanded", "false");
      t.querySelector(".pen-nav-toggle-text").textContent = "Navigator? Get back in";
      if (returnFocus) t.focus();
    }
    fit();
  }

  function clearError() {
    if (!drawerEl) return;
    var err = drawerEl.querySelector(".pen-nav-error");
    err.hidden = true;
    err.textContent = "";
    drawerEl.querySelector("input").removeAttribute("aria-invalid");
  }

  function showError(msg) {
    var err = drawerEl.querySelector(".pen-nav-error");
    var input = drawerEl.querySelector("input");
    err.textContent = msg;
    err.hidden = false;
    input.setAttribute("aria-invalid", "true");
    input.focus();
  }

  function turnOn(raw) {
    if (!String(raw || "").trim()) { showError("Enter your navigator code."); return; }
    var c = normalize(raw);
    if (!c) {
      showError("That code does not look right. Check it against your PEN email, or email the PEN team.");
      return;
    }
    var saved = write(c);
    window.penNav.code = c;
    window.penNav.active = true;
    paintStatus();
    showNotice(saved
      ? 'Navigator mode is on. Your code is <span class="pen-nav-code">' + esc(c) + "</span>."
      : "Navigator mode is on, but your browser is not saving, so it will turn off when you leave this page.");
    noticeEl.focus();
    changed(null);
  }

  paintStatus();
  if (notice) showNotice(notice);
})();
</script>
