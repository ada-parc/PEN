<!--
  PEN navigator mode.

  A navigator opens the site from a personal link, e.g. ...?nav=N-014-7.
  This script reads that code, checks it, keeps it in the visitor's own
  browser (localStorage key `pen:nav:v1`), and removes it from the address
  bar so it is not bookmarked or shared by accident. A public visitor
  never has a code and sees nothing from this file.

  Codes are "N-", three digits, and one check digit (the Damm algorithm,
  which catches every single wrong digit and every swap of two neighbouring
  digits). Set CHECK_DIGIT to false to accept the plain "N-014" form
  instead. scripts/navigator_codes.py makes the codes and links.

  Loaded via `include-after-body` in _quarto.yml, before
  assets/progress-init.html, so window.penNav is ready for it. The bar is
  placed inside #quarto-header, under the navbar, before Quarto measures the
  header, so page content still starts below it. Styles: `.pen-nav*` in
  pen.scss. Nothing here sends anything anywhere.
-->
<script>
(function () {
  "use strict";

  var KEY = "pen:nav:v1";
  var PARAM = "nav";
  var CHECK_DIGIT = true;
  var CONTACT = "mailto:hammel@uic.edu?subject=PEN%20navigator%20link";

  var DAMM = [
    [0, 3, 1, 7, 5, 9, 8, 6, 4, 2],
    [7, 0, 9, 2, 1, 5, 4, 8, 6, 3],
    [4, 2, 0, 6, 8, 7, 1, 3, 5, 9],
    [1, 7, 5, 0, 9, 8, 3, 4, 2, 6],
    [6, 1, 2, 3, 0, 4, 5, 9, 7, 8],
    [3, 6, 7, 4, 2, 0, 9, 5, 8, 1],
    [5, 8, 6, 9, 7, 2, 0, 1, 3, 4],
    [8, 9, 4, 5, 3, 6, 2, 0, 1, 7],
    [9, 4, 3, 8, 6, 1, 7, 2, 0, 5],
    [2, 5, 8, 1, 4, 3, 6, 7, 9, 0]
  ];

  function damm(digits) {
    var interim = 0;
    for (var i = 0; i < digits.length; i++) interim = DAMM[interim][+digits.charAt(i)];
    return interim;
  }

  // Accepts small variations (lowercase, spaces, missing or typographic
  // dashes) and returns the code in its one saved form, or null.
  function normalize(raw) {
    var s = String(raw || "").toUpperCase().replace(/[\s‐-―−]/g, function (c) {
      return /\s/.test(c) ? "" : "-";
    });
    var m = CHECK_DIGIT ? /^N-?(\d{3})-?(\d)$/.exec(s) : /^N-?(\d{3})$/.exec(s);
    if (!m) return null;
    if (CHECK_DIGIT && damm(m[1] + m[2]) !== 0) return null;
    return "N-" + m[1] + (CHECK_DIGIT ? "-" + m[2] : "");
  }

  function read() {
    try {
      var o = JSON.parse(window.localStorage.getItem(KEY) || "null");
      return o && typeof o.code === "string" && normalize(o.code) === o.code ? o : null;
    } catch (e) { return null; }
  }

  function write(code) {
    try { window.localStorage.setItem(KEY, JSON.stringify({ code: code, since: new Date().toISOString() })); return true; }
    catch (e) { return false; }
  }

  function clear() {
    try { window.localStorage.removeItem(KEY); } catch (e) {}
  }

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  // --- Read the link ------------------------------------------------
  var saved = read();
  var code = saved ? saved.code : null;
  var notice = null;
  var params = null;
  try { params = new URLSearchParams(window.location.search); } catch (e) {}

  if (params && params.has(PARAM)) {
    var fromLink = normalize(params.get(PARAM));
    if (!fromLink) {
      notice = 'This navigator link doesn’t look right. Check the link in your email, or <a class="no-external" href="' +
        CONTACT + '">contact us<span class="visually-hidden"> (opens your email app)</span></a>.';
    } else if (fromLink !== code) {
      if (code) notice = "Navigator mode is now " + fromLink + ", replacing " + code + ".";
      if (!write(fromLink)) {
        notice = "Your browser is not saving, so navigator mode will turn off when you leave this page.";
      }
      code = fromLink;
    }
    params.delete(PARAM);
    var qs = params.toString();
    try {
      window.history.replaceState(window.history.state, "",
        window.location.pathname + (qs ? "?" + qs : "") + window.location.hash);
    } catch (e) {}
  }

  window.penNav = {
    key: KEY,
    code: code,
    active: Boolean(code),
    normalize: normalize,
    off: function () { turnOff(); }
  };

  function changed(previous) {
    try {
      window.dispatchEvent(new CustomEvent("pen:navchange", { detail: { code: window.penNav.code, previous: previous } }));
    } catch (e) {}
  }

  // --- The bar under the navbar ---------------------------------------
  var header = document.getElementById("quarto-header");
  if (!header) return;
  var bar = document.createElement("div");
  bar.className = "pen-nav";
  bar.setAttribute("role", "region");
  bar.setAttribute("aria-label", "Navigator mode");
  header.appendChild(bar);

  // Two parts: the status line (only in navigator mode) and a notice line
  // that is always in the page, so screen readers announce what lands in it.
  bar.innerHTML = '<div class="pen-nav-status" hidden></div>' +
    '<div class="pen-nav-notice" role="status" tabindex="-1" hidden></div>';
  var statusEl = bar.querySelector(".pen-nav-status");
  var noticeEl = bar.querySelector(".pen-nav-notice");
  var dialog = null;

  function paintStatus() {
    if (window.penNav.active) {
      statusEl.innerHTML = '<p class="pen-nav-label">' +
        '<strong>Navigator<span class="pen-nav-long"> mode</span></strong>' +
        '<span class="pen-nav-dot pen-nav-long" aria-hidden="true">\u00b7</span>' +
        '<span class="pen-nav-code">' + esc(window.penNav.code) + '</span></p>' +
        '<span class="pen-nav-dot" aria-hidden="true">\u00b7</span>' +
        '<button type="button" class="pen-nav-off">Turn off</button>';
      statusEl.querySelector(".pen-nav-off").addEventListener("click", confirmOff);
    } else {
      statusEl.innerHTML = "";
    }
    statusEl.hidden = !window.penNav.active;
    fit();
  }

  function showNotice(html) {
    noticeEl.hidden = false;
    noticeEl.innerHTML = "";
    fit();
    window.setTimeout(function () {
      noticeEl.innerHTML = "<p>" + html + '</p><button type="button" class="pen-nav-dismiss">Dismiss</button>';
      noticeEl.querySelector(".pen-nav-dismiss").addEventListener("click", dismissNotice);
      fit();
    }, 30);
  }

  function dismissNotice() {
    noticeEl.innerHTML = "";
    noticeEl.hidden = true;
    fit();
    var off = statusEl.querySelector(".pen-nav-off");
    var main = document.querySelector("main");
    if (off) off.focus();
    else if (main) { main.setAttribute("tabindex", "-1"); main.focus(); }
  }

  // Hide the bar when it is empty. Quarto re-offsets the page by the
  // header's height on resize, so tell it the height changed.
  function fit() {
    bar.hidden = statusEl.hidden && noticeEl.hidden;
    try { window.dispatchEvent(new Event("resize")); } catch (e) {}
  }

  function confirmOff() {
    if (!dialog) {
      dialog = document.createElement("dialog");
      dialog.className = "pen-nav-dialog";
      dialog.setAttribute("aria-labelledby", "pen-nav-dialog-title");
      dialog.setAttribute("aria-describedby", "pen-nav-dialog-text");
      dialog.innerHTML = '<p class="pen-nav-dialog-title" id="pen-nav-dialog-title">Turn off navigator mode?</p>' +
        '<p id="pen-nav-dialog-text">Your progress stays. Your completions will no longer be recorded.</p>' +
        '<div class="pen-nav-dialog-actions">' +
        '<button type="button" class="pen-nav-dialog-keep" autofocus>Keep it on</button>' +
        '<button type="button" class="pen-nav-dialog-confirm">Turn off</button></div>';
      document.body.appendChild(dialog);
      // Keep it on and Escape both close it and put focus back on Turn off.
      function keep() { var off = statusEl.querySelector(".pen-nav-off"); if (off) off.focus(); }
      dialog.querySelector(".pen-nav-dialog-keep").addEventListener("click", function () { dialog.close(); keep(); });
      dialog.querySelector(".pen-nav-dialog-confirm").addEventListener("click", function () { dialog.close(); turnOff(); });
      dialog.addEventListener("cancel", function () { window.setTimeout(keep, 0); });
    }
    if (typeof dialog.showModal === "function") dialog.showModal();
    else if (window.confirm("Turn off navigator mode? Your progress stays. Your completions will no longer be recorded.")) turnOff();
  }

  function turnOff() {
    var previous = window.penNav.code;
    if (!previous) return;
    clear();
    window.penNav.code = null;
    window.penNav.active = false;
    paintStatus();
    showNotice("Navigator mode is off. Your progress stays.");
    noticeEl.focus();
    changed(previous);
  }

  paintStatus();
  if (notice) showNotice(notice);
})();
</script>
