<!--
  PEN progress tracking.

  Loaded on every page via `include-after-body` in _quarto.yml, right after
  assets/pen-manifest.html (which defines window.penManifest, see
  R/build_modules.R). Everything here stays in the visitor's own browser
  (localStorage). No account, no network request, no analytics.
  If storage is unavailable (private window, blocked), the site still
  works, the controls just do not persist.

  Unit ids are compound: "<module id>-<unit id>", e.g. "01-02" for Module
  1's second unit. A module is complete when every id in
  window.penManifest[moduleId] is done. The series is complete when every
  tracked module is complete. (Module 4, Resources, has no units and is not
  part of window.penManifest, so it is never part of this calculation.)

  The script below is intentionally inlined rather than kept in a separate
  .js file, so that a project subpath cannot break the resource URL. Edit
  it here.
-->
<div id="pen-live" class="visually-hidden" aria-live="polite" role="status"></div>

<script>
(function () {
  "use strict";

  var KEY = "pen:progress:v1";
  var NAME_KEY = "pen:name:v1";
  var RECORD_KEY = "pen:record:v1";
  var LAYOUT_KEY = "pen:certlayout:v1";
  var live = document.getElementById("pen-live");
  var manifest = window.penManifest || {};

  function announce(msg) {
    if (live) { live.textContent = ""; window.setTimeout(function () { live.textContent = msg; }, 30); }
  }

  function read() {
    try {
      var raw = window.localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : {};
    } catch (e) { return {}; }
  }

  function write(state) {
    try { window.localStorage.setItem(KEY, JSON.stringify(state)); return true; }
    catch (e) { return false; }
  }

  function isDone(state, id) {
    return Boolean(state[id] && state[id].done);
  }

  // A module is done when every unit id in its manifest entry is done.
  function moduleDone(state, moduleId) {
    var ids = manifest[moduleId] || [];
    if (ids.length === 0) return false;
    return ids.every(function (unitId) { return isDone(state, moduleId + "-" + unitId); });
  }

  function moduleProgress(state, moduleId) {
    var ids = manifest[moduleId] || [];
    var done = ids.filter(function (unitId) { return isDone(state, moduleId + "-" + unitId); }).length;
    return { done: done, total: ids.length };
  }

  // The series is done when every tracked module in the manifest is done.
  function seriesDone(state) {
    var moduleIds = Object.keys(manifest);
    if (moduleIds.length === 0) return false;
    return moduleIds.every(function (mid) { return moduleDone(state, mid); });
  }

  function readName() {
    try { return window.localStorage.getItem(NAME_KEY) || ""; } catch (e) { return ""; }
  }

  function writeName(name) {
    try { window.localStorage.setItem(NAME_KEY, name); return true; } catch (e) { return false; }
  }

  // --- Unit page: "Mark unit complete" ---------------------------------
  // Every unit ends with a "Finished this unit?" box and one button. The
  // visitor marks the unit complete themselves, once they have watched its
  // video(s) or read the transcript; nothing completes on its own, and a
  // completed unit cannot be un-marked. When a video ends, the page scrolls
  // to the button. Saved as state[id] = { done, at, via: "button" }. Units
  // completed by the earlier automatic rule ({ via: "video" | "transcript" })
  // stay complete.
  var repaintUnit = null;

  function initUnit() {
    var box = document.querySelector("[data-pen-progress]");
    if (!box) return;
    var id = box.getAttribute("data-unit");
    var title = box.getAttribute("data-unit-title") || id;
    var todo = box.querySelector("[data-pen-todo]");
    var todoText = box.querySelector("[data-pen-todo-text]");
    var btn = box.querySelector("[data-pen-complete]");
    var doneBox = box.querySelector("[data-pen-done]");
    var doneLabel = box.querySelector("[data-pen-done-label]");
    var videos = document.querySelectorAll("video[data-pen-part]");
    var total = videos.length;

    // "Up next", inside the completed box. On a module's last unit it says
    // when the module or the whole series is finished, and points at the
    // certificate once it is unlocked.
    var after = box.querySelector("[data-pen-after-complete]");
    var afterLabel = after && after.querySelector("[data-pen-after-label]");
    var afterLink = after && after.querySelector("[data-pen-after-link]");
    var afterDefault = after && {
      label: afterLabel.textContent,
      text: afterLink.textContent,
      href: afterLink.getAttribute("href")
    };

    function paintAfter(state) {
      if (!after) return;
      afterLabel.textContent = afterDefault.label;
      afterLink.textContent = afterDefault.text;
      afterLink.setAttribute("href", afterDefault.href);
      if (!after.hasAttribute("data-last-unit")) return;
      var mid = id.split("-")[0];
      if (seriesDone(state)) {
        afterLabel.textContent = "You have completed the training.";
        afterLink.textContent = "Get your certificate";
        afterLink.setAttribute("href", afterLink.getAttribute("data-cert-href"));
      } else if (moduleDone(state, mid)) {
        afterLabel.textContent = "Every unit in this module is complete.";
      }
    }

    todoText.textContent = total > 1
      ? "Once you have watched all " + total + " videos or read their transcripts, mark the unit complete."
      : total === 1
        ? "Once you have watched the video or read the transcript, mark the unit complete."
        : "Once you have worked through this unit, mark it complete.";

    function paint() {
      var state = read();
      var done = isDone(state, id);
      box.setAttribute("data-state", done ? "done" : "todo");
      todo.classList.toggle("is-hidden", done);
      doneBox.classList.toggle("is-hidden", !done);
      if (done) paintAfter(state);
    }

    function complete() {
      var state = read();
      if (isDone(state, id)) return;
      state[id] = { done: true, at: new Date().toISOString(), via: "button" };
      var saved = write(state);
      paint();
      // The button just pressed is gone; put focus on what replaced it.
      doneLabel.focus();
      if (!saved) {
        announce("Your browser is not saving progress, so this will not be remembered.");
        return;
      }
      announce(title + " complete." + (afterLink ? " " + afterLink.textContent + " is the next link." : ""));
      syncRecords(true);
    }

    // A video reached its end: bring the button into view (and focus it),
    // without completing anything.
    function showButton() {
      if (isDone(read(), id)) return;
      var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (document.fullscreenElement && document.exitFullscreen) { try { document.exitFullscreen(); } catch (e) {} }
      box.scrollIntoView({ behavior: still ? "auto" : "smooth", block: "center" });
      btn.focus({ preventScroll: true });
    }

    btn.addEventListener("click", complete);
    Array.prototype.forEach.call(videos, function (video) {
      video.addEventListener("ended", showButton);
    });

    repaintUnit = paint;
    paint();
  }

  // --- Any page: fill in unit status text + counts ------------------
  function initStatuses() {
    var state = read();
    var nodes = document.querySelectorAll("[data-pen-unit]");
    Array.prototype.forEach.call(nodes, function (el) {
      var id = el.getAttribute("data-pen-unit");
      var done = isDone(state, id);
      el.setAttribute("data-state", done ? "done" : "todo");
      el.textContent = done ? "Completed" : "Not started";
    });

    // Module landing page: "N of M units complete"
    var modCount = document.querySelector("[data-pen-count-module]");
    if (modCount) {
      var mid = modCount.getAttribute("data-pen-count-module");
      var prog = moduleProgress(state, mid);
      modCount.textContent = prog.done + " of " + prog.total + " units complete";
      // The bar is a real progressbar for assistive tech (name, value and a
      // plain-words valuetext); its ticks are decorative, one divider per
      // unit boundary. Until this runs it stays aria-hidden.
      var fill = document.querySelector("[data-pen-count-fill]");
      var bar = fill && fill.parentNode;
      if (bar) {
        var txt = modCount.textContent;
        fill.style.width = (prog.total ? Math.round(100 * prog.done / prog.total) : 0) + "%";
        bar.setAttribute("role", "progressbar");
        bar.setAttribute("aria-label", "Module progress");
        bar.setAttribute("aria-valuemin", "0");
        bar.setAttribute("aria-valuemax", String(prog.total));
        bar.setAttribute("aria-valuenow", String(prog.done));
        bar.setAttribute("aria-valuetext", txt);
        bar.removeAttribute("aria-hidden");
        if (!bar.querySelector(".module-progress-tick")) {
          for (var t = 1; t < prog.total; t++) {
            var tick = document.createElement("span");
            tick.className = "module-progress-tick";
            tick.setAttribute("aria-hidden", "true");
            tick.style.left = (100 * t / prog.total) + "%";
            bar.appendChild(tick);
          }
        }
      }
    }

    // Home page: module cards show a status pill + overall series count
    var moduleNodes = document.querySelectorAll("[data-pen-module]");
    Array.prototype.forEach.call(moduleNodes, function (el) {
      var mid = el.getAttribute("data-pen-module");
      var prog = moduleProgress(state, mid);
      var done = prog.total > 0 && prog.done === prog.total;
      var started = prog.done > 0;
      el.setAttribute("data-state", done ? "done" : (started ? "in-progress" : "todo"));
      el.textContent = done ? "Completed" : (started ? (prog.done + " of " + prog.total + " complete") : "Not started");
    });

    var seriesCount = document.querySelector("[data-pen-count-series]");
    if (seriesCount) {
      var moduleIds = Object.keys(manifest);
      var modulesDone = moduleIds.filter(function (mid) { return moduleDone(state, mid); }).length;
      seriesCount.textContent = modulesDone + " of " + moduleIds.length + " modules complete";
    }

    // Home hero progress bar: share of all tracked units complete.
    // Decorative echo of the count text above (aria-hidden in the markup).
    var bar = document.querySelector("[data-pen-bar]");
    if (bar) {
      var totalUnits = 0, doneUnits = 0;
      Object.keys(manifest).forEach(function (mid) {
        var p = moduleProgress(state, mid);
        totalUnits += p.total;
        doneUnits += p.done;
      });
      bar.style.width = (totalUnits ? Math.round((doneUnits / totalUnits) * 100) : 0) + "%";
    }

    // Home hero primary button: "Start Module 1" until progress exists, then
    // "Continue Module N" pointing at the first unfinished module, then the
    // certificate once the series is done. The module hrefs are read off the
    // tracker links so no path is hard-coded here.
    var startBtn = document.querySelector("[data-pen-start]");
    var startLabel = startBtn && startBtn.querySelector("[data-pen-start-label]");
    if (startBtn && startLabel) {
      var ids = Object.keys(manifest);
      var anyDone = ids.some(function (mid) { return moduleProgress(state, mid).done > 0; });
      var nextId = ids.filter(function (mid) { return !moduleDone(state, mid); })[0];
      if (seriesDone(state)) {
        var certLink = document.querySelector("[data-pen-certificate-ready] a");
        if (certLink) {
          startLabel.textContent = "Get your certificate";
          startBtn.setAttribute("href", certLink.getAttribute("href"));
        }
      } else if (anyDone && nextId) {
        var target = document.querySelector('[data-pen-module="' + nextId + '"]');
        var targetLink = target && target.closest("a");
        if (targetLink) {
          startLabel.textContent = "Continue Module " + parseInt(nextId, 10);
          startBtn.setAttribute("href", targetLink.getAttribute("href"));
        }
      }
    }

    // Home page / any page: show a "get your certificate" link once the
    // whole series is done. Hidden by default in HTML; unhidden here.
    var certLinks = document.querySelectorAll("[data-pen-certificate-ready]");
    var ready = seriesDone(state);
    Array.prototype.forEach.call(certLinks, function (el) {
      el.hidden = !ready;
    });
    // Home progress card: the certificate link takes the count's place in the
    // header. The count stays in the DOM, visually hidden, so "3 of 3 modules
    // complete" is still announced and the card never changes height.
    var countEl = document.querySelector("[data-pen-count-series]");
    if (countEl) countEl.classList.toggle("visually-hidden", ready);
  }

  // --- Certificate page ------------------------------------------------
  function initCertificate() {
    var gate = document.querySelector("[data-pen-certificate-gate]");
    var body = document.querySelector("[data-pen-certificate-body]");
    if (!gate && !body) return;

    var state = read();
    var ready = seriesDone(state);

    // Class-based, not the `hidden` attribute: Safari's print pipeline can
    // paint a blank page for content whose `hidden` attribute was removed
    // by script (the certificate sheet printed empty even though it showed
    // fine on screen). A CSS class does not have this failure mode.
    if (gate) gate.classList.toggle("is-hidden", ready);
    if (body) body.classList.toggle("is-hidden", !ready);
    if (!ready) return;

    var nameInput = document.querySelector("[data-pen-name-input]");
    var nameOut = document.querySelectorAll("[data-pen-name-output]");
    var dateOut = document.querySelectorAll("[data-pen-date-output]");

    function paintName() {
      var name = readName() || "Your name here";
      Array.prototype.forEach.call(nameOut, function (el) { el.textContent = name; });
    }

    // The date the training was finished: the last unit completed in any
    // tracked module, not the day the page is opened.
    var last = "";
    Object.keys(manifest).forEach(function (mid) {
      (manifest[mid] || []).forEach(function (unitId) {
        var at = state[mid + "-" + unitId] && state[mid + "-" + unitId].at;
        if (typeof at === "string" && at > last) last = at;
      });
    });
    var finished = last ? new Date(last) : new Date();
    if (isNaN(finished.getTime())) finished = new Date();
    var dateStr = finished.toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
    Array.prototype.forEach.call(dateOut, function (el) { el.textContent = dateStr; });

    // Navigator code: shown only in navigator mode, gone if it is turned off.
    function paintNav() {
      var nav = window.penNav;
      var on = Boolean(nav && nav.active && nav.code);
      Array.prototype.forEach.call(document.querySelectorAll("[data-pen-nav-only]"), function (el) { el.hidden = !on; });
      Array.prototype.forEach.call(document.querySelectorAll("[data-pen-nav-code]"), function (el) { el.textContent = on ? nav.code : ""; });
    }
    paintNav();
    window.addEventListener("pen:navchange", paintNav);

    // Layout (landscape or portrait), remembered on this device. The sheet is
    // laid out at real paper size and scaled to the column on screen; print
    // gets a matching @page size with no margin.
    var stage = document.querySelector("[data-pen-cert-stage]");
    var paper = document.querySelector("[data-pen-cert-paper]");
    var radios = document.querySelectorAll("[data-pen-cert-layout]");
    var pageRule = document.createElement("style");
    document.head.appendChild(pageRule);

    // A long name wraps; if the sheet then overflows, step the name size
    // down (to no smaller than 30px) until everything fits inside the border.
    function fitName() {
      var content = paper.querySelector(".cert-content");
      var nameEl = paper.querySelector(".cert-name");
      if (!content || !nameEl) return;
      nameEl.style.fontSize = "";
      var size = parseFloat(window.getComputedStyle(nameEl).fontSize);
      while (content.scrollHeight > content.clientHeight + 1 && size > 30) {
        size -= 2;
        nameEl.style.fontSize = size + "px";
      }
    }

    function fit() {
      if (!stage || !paper || !stage.clientWidth) return;
      fitName();
      var scale = Math.min(1, stage.clientWidth / paper.offsetWidth);
      paper.style.transform = "scale(" + scale + ")";
      stage.style.height = (paper.offsetHeight * scale) + "px";
    }

    function setLayout(layout) {
      if (layout !== "portrait") layout = "landscape";
      if (paper) {
        paper.classList.toggle("is-portrait", layout === "portrait");
        paper.classList.toggle("is-landscape", layout === "landscape");
      }
      Array.prototype.forEach.call(radios, function (r) { r.checked = r.value === layout; });
      pageRule.textContent = "@page { size: letter " + layout + "; margin: 0; }";
      fit();
    }

    var savedLayout = "landscape";
    try { savedLayout = window.localStorage.getItem(LAYOUT_KEY) || "landscape"; } catch (e) {}
    setLayout(savedLayout);
    Array.prototype.forEach.call(radios, function (r) {
      r.addEventListener("change", function () {
        if (!r.checked) return;
        setLayout(r.value);
        try { window.localStorage.setItem(LAYOUT_KEY, r.value); } catch (e) {}
      });
    });
    window.addEventListener("resize", fit);
    if (nameInput) nameInput.addEventListener("input", fit);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

    if (nameInput) {
      nameInput.value = readName();
      nameInput.addEventListener("input", function () {
        writeName(nameInput.value.trim());
        paintName();
      });
    }
    paintName();
  }

  // Called from the certificate page's print button. Deferring one paint
  // past the click keeps the same Safari bug (see initCertificate) from
  // printing a stale, pre-reveal snapshot of the certificate: this gives
  // the browser a real render pass of the current DOM before entering the
  // print pipeline, rather than calling window.print() synchronously.
  window.penPrintCertificate = function () {
    window.requestAnimationFrame(function () {
      window.requestAnimationFrame(function () {
        window.print();
      });
    });
  };

  // --- Reset control (on How to Use / Help) ------------------------
  function initReset() {
    var btn = document.querySelector("[data-pen-reset]");
    if (!btn) return;
    btn.addEventListener("click", function () {
      if (!window.confirm("Clear your saved progress on this device? This cannot be undone.")) return;
      try {
        window.localStorage.removeItem(KEY);
        window.localStorage.removeItem(NAME_KEY);
      } catch (e) {}
      initStatuses();
      if (repaintUnit) repaintUnit();
      announce("Saved progress cleared.");
    });
  }

  window.penProgress = {
    get: read,
    moduleDone: function (mid) { return moduleDone(read(), mid); },
    seriesDone: function () { return seriesDone(read()); },
    reset: function () {
      try {
        window.localStorage.removeItem(KEY);
        window.localStorage.removeItem(NAME_KEY);
      } catch (e) {}
    }
  };

  // --- Recording hook (navigator mode only) ---------------------------
  // When a navigator finishes a module, and when the certificate unlocks
  // (the last module finishes, not when it is printed), this calls
  // window.penRecord(event) and fires a `pen:record` event on window:
  //   { type: "module", module: "02", code: "N-014-9", at: <ISO time> }
  //   { type: "certificate", code: "N-014-9", at: <ISO time> }
  // `at` is when the module (or the last module) was finished. Each event
  // fires once per code: pen:record:v1 keeps { code: { "module-02": iso,
  // certificate: iso } } with the time it fired. Resetting progress keeps
  // that list, so finishing a module again never records it twice. It also
  // catches up on every page load, so modules finished before the navigator
  // link was opened, or while navigator mode was off, are sent too.
  // `live` is true on events from a unit just marked complete, false on
  // catch-up. penRecord does nothing yet; assets/checkin-init.html listens
  // for `pen:record` and shows the navigator check-in. Public visitors never
  // reach any of this.
  window.penRecord = window.penRecord || function () {};

  function readRecords() {
    try { return JSON.parse(window.localStorage.getItem(RECORD_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }

  // The latest `at` among a module's units; now if none is saved.
  function finishedAt(state, mid) {
    var latest = "";
    (manifest[mid] || []).forEach(function (unitId) {
      var at = state[mid + "-" + unitId] && state[mid + "-" + unitId].at;
      if (typeof at === "string" && at > latest) latest = at;
    });
    return latest || new Date().toISOString();
  }

  // `live` is true when the visitor just completed a unit (the check-in
  // card may open); events caught up on page load are not live.
  function syncRecords(live) {
    var nav = window.penNav;
    if (!nav || !nav.active || !nav.code) return;
    var state = read();
    var records = readRecords();
    var mine = records[nav.code] || {};
    var due = [];
    var last = "";
    Object.keys(manifest).forEach(function (mid) {
      if (!moduleDone(state, mid)) return;
      var at = finishedAt(state, mid);
      if (at > last) last = at;
      if (!mine["module-" + mid]) due.push({ key: "module-" + mid, event: { type: "module", module: mid, code: nav.code, at: at } });
    });
    if (seriesDone(state) && !mine.certificate) {
      due.push({ key: "certificate", event: { type: "certificate", code: nav.code, at: last } });
    }
    if (!due.length) return;
    // Mark them first, so a failing handler can never send one twice.
    var now = new Date().toISOString();
    due.forEach(function (d) { mine[d.key] = now; });
    records[nav.code] = mine;
    try { window.localStorage.setItem(RECORD_KEY, JSON.stringify(records)); } catch (e) {}
    due.forEach(function (d) { d.event.live = Boolean(live); });
    due.forEach(function (d) {
      try { window.penRecord(d.event); } catch (e) {}
      try { window.dispatchEvent(new CustomEvent("pen:record", { detail: d.event })); } catch (e) {}
    });
  }

  function initAll() {
    initUnit();
    initStatuses();
    initCertificate();
    initReset();
    syncRecords(false);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initAll);
  } else {
    initAll();
  }
})();
</script>
